<title>學習扶助闖關地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a metro route map — three colored lines (number / relation / shape & measure), each indicator is a station; levels open as full-screen play cards */
:root{
  --bg:#EAF0F2; --surface:#FFFFFF; --surface-2:#F4F7F8; --ink:#17262F; --ink-2:#4F6470; --rule:#CCD8DD;
  --line-n:#0B8577; --line-r:#D9822B; --line-s:#3A62C9;
  --frog:#F4B400; --frog-ink:#5A4300;
  --good:#23894E; --good-bg:#E2F3E8; --bad:#C2413A; --bad-bg:#FBE7E5; --warn:#9A6A00; --warn-bg:#FFF3D1;
  --shadow:0 1px 2px rgba(23,38,47,.08),0 6px 18px rgba(23,38,47,.08);
  --f-display:"LXGW WenKai TC","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181D; --surface:#19242B; --surface-2:#1F2C34; --ink:#E4ECEF; --ink-2:#9DB0BA; --rule:#2E3E47;
  --line-n:#2BB5A4; --line-r:#F0A04B; --line-s:#7194F0;
  --frog:#F7C531; --frog-ink:#3A2B00;
  --good:#5BC489; --good-bg:#16352A; --bad:#F07D74; --bad-bg:#3A1E1C; --warn:#F0C24B; --warn-bg:#3A3015;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181D; --surface:#19242B; --surface-2:#1F2C34; --ink:#E4ECEF; --ink-2:#9DB0BA; --rule:#2E3E47;
  --line-n:#2BB5A4; --line-r:#F0A04B; --line-s:#7194F0;
  --frog:#F7C531; --frog-ink:#3A2B00;
  --good:#5BC489; --good-bg:#16352A; --bad:#F07D74; --bad-bg:#3A1E1C; --warn:#F0C24B; --warn-bg:#3A3015;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--line-s);outline-offset:2px}
.muted{color:var(--ink-2)}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--ink-2);font-weight:500}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 8px 6px 16px}
.who label{font-size:14px;color:var(--ink-2)}
.who input{width:96px;border:0;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-family:var(--f-num);font-size:18px;color:var(--ink)}

/* ---------- metro map ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:6px;border-radius:3px;display:inline-block}
.lines{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
@media (min-width:640px){.lines{grid-template-columns:1fr 1fr;grid-template-areas:"n s" "r s"}.line.n{grid-area:n}.line.r{grid-area:r}.line.s{grid-area:s}}
.line{--c:var(--line-n);background:var(--surface);border-radius:18px;padding:18px 16px 10px;box-shadow:var(--shadow);min-width:0}
.line.r{--c:var(--line-r)} .line.s{--c:var(--line-s)}
.line-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.line-badge{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-num);font-weight:700;font-size:18px;display:grid;place-items:center;flex:none}
.stations{list-style:none;margin:0;padding:0;position:relative}
.stations::before{content:"";position:absolute;left:16px;top:22px;bottom:22px;width:6px;border-radius:3px;background:var(--c)}
.st{position:relative}
.st button{width:100%;display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:12px;padding:10px 6px 10px 0}
.st button:not([disabled]):hover{background:var(--surface-2)}
.st button[disabled]{cursor:default}
.dot{width:26px;height:26px;margin-left:6px;border-radius:50%;background:var(--surface);border:5px solid var(--c);position:relative;z-index:1}
.st.done .dot{background:var(--c)}
.st.open .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.st-name{font-weight:700;font-size:17px;display:block;line-height:1.35}
.st-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:13px;color:var(--ink-2)}
.code{font-family:var(--f-num);letter-spacing:.02em}
.pill{display:inline-block;font-size:12.5px;font-weight:500;border-radius:999px;padding:1px 9px;background:var(--surface-2);color:var(--ink-2)}
.pill.go{background:var(--c);color:#fff}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:17px;background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;border:2px solid var(--rule);color:var(--ink)}
.btn.small{padding:8px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 12px}

/* ---------- login ---------- */
.login-top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
.login-qr{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:3px solid var(--line-n);border-radius:16px;padding:10px 10px 8px}
.login-qr #qrl{background:#fff;padding:6px;border-radius:8px;line-height:0}
.login-qr #qrl img,.login-qr #qrl canvas{display:block;width:132px;height:132px}
.login-qr figcaption{font-size:14px;font-weight:700;color:var(--ink)}
.login-head{display:flex;flex-direction:column;gap:6px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kid{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left}
.kid:hover{border-color:var(--line-n)}
.kid .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:22px;flex:none}
.kid .nm{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2}
.kid .sub{font-size:13px;color:var(--ink-2)}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 6px 6px 8px}
.me .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:18px}
.me .nm{font-family:var(--f-display);font-size:20px;font-weight:700}
.overview td button{background:none;border:0;padding:0;color:var(--line-s);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px}
tr.sel td,tr.sel th{background:var(--surface-2)}
.pg{min-width:0;font-size:13.5px}
.pg th,.pg td{border-bottom:1px solid var(--rule);padding:6px 4px;text-align:center}
.pg-name{position:sticky;left:0;background:var(--surface);text-align:left!important;white-space:nowrap;z-index:1;padding-left:2px!important}
.pg-name button{background:none;border:0;padding:0;color:var(--line-s);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px;font-family:var(--f-body)}
tfoot .pg-name{font-size:13px;color:var(--ink-2);font-weight:500}
.pg-sum{white-space:nowrap;min-width:84px}
.pg-sum .num{font-weight:600;display:block}
.bar{display:block;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good)}
.pg-h{min-width:64px;font-size:12.5px;line-height:1.3;color:var(--ink);font-weight:700;vertical-align:bottom;border-bottom:4px solid var(--line-n)!important}
.pg-h.r{border-bottom-color:var(--line-r)!important}.pg-h.s{border-bottom-color:var(--line-s)!important}
.pg-h .code{display:block;font-size:10.5px;color:var(--ink-2);font-weight:500}
.pg-c{font-size:12.5px;font-weight:600;white-space:nowrap}
td.pg-c{border-left:2px solid var(--surface)}
.pg-c.good{background:var(--good-bg);color:var(--good)}
.pg-c.warn{background:var(--warn-bg);color:var(--warn)}
.pg-c.bad{background:var(--bad-bg);color:var(--bad)}
.pg-c.new{background:color-mix(in srgb,var(--line-s) 14%,var(--surface));color:var(--line-s)}
.pg-c.todo{background:var(--surface-2);color:var(--ink-2);font-weight:400}
.pg-c.none{background:transparent}
.pg-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--ink-2)}
.pg-legend .pg-c{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:2px 6px;margin-left:6px;border:1px solid var(--rule)}

/* ---------- teacher extras ---------- */
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.pin-form{max-width:360px;display:flex;flex-direction:column;gap:10px}
.pin-form input{font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid var(--rule);background:var(--surface-2);color:var(--ink);font-family:var(--f-num)}
.rep.qr-card{flex-direction:row;flex-wrap:wrap;align-items:center;gap:18px}
.qr{background:#fff;padding:10px;border-radius:12px;line-height:0}
.qr img,.qr canvas{display:block}
.qr-text{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.url{font-family:var(--f-num);font-size:13px;word-break:break-all;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bad);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:10}

/* ---------- play screen ---------- */
.play{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 22px;display:flex;flex-direction:column;gap:18px;min-height:540px}
.play-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.track{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.leg{display:flex;gap:4px;align-items:center}
.leg b{width:12px;height:12px;border-radius:50%;background:var(--rule)}
.leg b.ok{background:var(--good)} .leg b.no{background:var(--bad)} .leg b.now{background:var(--frog);box-shadow:0 0 0 3px color-mix(in srgb,var(--frog) 35%,transparent)}
.leg + .leg::before{content:"";width:14px;height:3px;background:var(--rule);border-radius:2px;margin-right:6px}
.stage-title{display:flex;flex-direction:column;gap:2px}
.prompt{font-size:20px;font-weight:500}
.big-q{font-family:var(--f-num);font-size:clamp(44px,10vw,72px);font-weight:600;text-align:center;line-height:1.1;letter-spacing:.02em}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.choice{border:3px solid var(--rule);background:var(--surface-2);border-radius:18px;padding:16px 10px;font-family:var(--f-num);font-size:30px;font-weight:600;min-height:72px;transition:transform .08s}
.choice.txt{font-family:var(--f-body);font-size:20px;font-weight:700}
.choice:active{transform:scale(.97)}
.choice.picked{border-color:var(--frog);background:color-mix(in srgb,var(--frog) 18%,var(--surface))}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.step.dim{opacity:.45}
.step .lhs{font-family:var(--f-num);font-size:30px;font-weight:600;min-width:120px}
.step .choices{flex:1;min-width:220px}
.step .choice{font-size:26px;min-height:60px;padding:10px}
.timer{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--frog);transform-origin:left;transition:transform linear}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.feedback.ok{background:var(--good-bg)} .feedback.no{background:var(--warn-bg)}
.feedback p{font-size:18px;flex:1;min-width:220px}
.feedback strong{font-family:var(--f-display);font-size:21px;display:block}
.nl-wrap{background:var(--surface-2);border-radius:18px;padding:8px 6px;touch-action:none}
.nl-wrap svg{width:100%;height:auto;display:block}
.nl-wrap text{font-family:var(--f-num);font-weight:600;fill:var(--ink)}
.frog{cursor:grab}
.frog:active{cursor:grabbing}
.say{font-family:var(--f-display);font-size:22px}
.detective{display:flex;gap:14px;align-items:center;background:var(--surface-2);border-radius:18px;padding:14px 16px}
.detective .face{width:56px;height:56px;border-radius:50%;background:var(--line-r);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;flex:none}
.detective .eq{font-family:var(--f-num);font-size:clamp(28px,6vw,40px);font-weight:600}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:20px 0}
.stars{font-family:var(--f-num);font-size:44px;color:var(--frog);letter-spacing:6px}
.intro-list{display:grid;gap:10px;text-align:left;max-width:520px;width:100%}
.intro-list div{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);padding:10px 14px;border-radius:12px}
.intro-list b{font-family:var(--f-num);color:var(--line-n);font-size:20px;line-height:1.4}


[hidden]{display:none!important}
/* ---------- shared game parts ---------- */
:root{--bar-a:#BFE3DC;--bar-b:#FBD9B0;--bt-h:#9DB7F0;--bt-t:#F4A259;--bt-o:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar-a:#1F5C54;--bar-b:#6B4A22;--bt-h:#3E5FA8;--bt-t:#B8682A;--bt-o:#DDE6EA}}
:root[data-theme="dark"]{--bar-a:#1F5C54;--bar-b:#6B4A22;--bt-h:#3E5FA8;--bt-t:#B8682A;--bt-o:#DDE6EA}
.big-inline{font-family:var(--f-num);font-size:32px;font-weight:600;padding:0 4px}
.big-text{font-size:22px;line-height:1.7}
.np{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.np-slots{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.np-g{display:inline-flex;align-items:center;gap:6px}
.np-t{font-size:22px;font-family:var(--f-display)}
.np-slot{min-width:110px;height:64px;border-radius:14px;border:3px solid var(--rule);background:var(--surface);font-family:var(--f-num);font-size:34px;font-weight:600;padding:0 12px}
.np-slot.sm{min-width:0;width:52px;height:58px;padding:0}
.np-slot.act{border-color:var(--frog);box-shadow:0 0 0 4px color-mix(in srgb,var(--frog) 30%,transparent)}
.np-keys{display:grid;grid-template-columns:repeat(6,minmax(48px,64px));gap:8px}
@media (max-width:460px){.np-keys{grid-template-columns:repeat(3,minmax(64px,1fr));width:100%}}
.np-k{height:54px;border-radius:12px;border:2px solid var(--rule);background:var(--surface-2);font-family:var(--f-num);font-size:24px;font-weight:600}
.np-k.go{background:var(--ink);color:var(--surface);border-color:var(--ink);font-family:var(--f-body);font-size:18px}
.np-k.del{font-size:20px}
.np-k:disabled{opacity:.4;cursor:default}
.bt{display:inline-block;flex:none}
.bt.h{width:64px;height:64px;background-color:var(--bt-h);background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);background-size:6.4px 6.4px;border:1.5px solid var(--ink);opacity:.95}
.bt.t{width:9px;height:64px;background-color:var(--bt-t);background-image:linear-gradient(var(--ink) 1px,transparent 1px);background-size:9px 6.4px;border:1.5px solid var(--ink)}
.bt.o{width:9px;height:9px;background:var(--bt-o);border:1.5px solid var(--ink)}
.bt-pic{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;background:var(--surface-2);border-radius:16px;padding:16px}
.bt-grp{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;max-width:100%}
.bb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.bb-col{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bb-name{font-weight:700;font-size:15px}
.bb-area{min-height:150px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;align-items:flex-end}
.bb-area .bt.h{width:44px;height:44px;background-size:4.4px 4.4px}
.bb-area .bt.t{height:44px;background-size:9px 4.4px}
.bb-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bb-b{width:52px;height:46px;border-radius:12px;border:2px solid var(--rule);background:var(--surface);font-size:26px;font-weight:700;line-height:1}
@media (max-width:460px){.bb{grid-template-columns:1fr}.bb-area{min-height:60px}}
.seq{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--f-num);font-size:clamp(24px,5vw,32px);font-weight:600}
.seq-n{background:var(--surface-2);border-radius:12px;padding:6px 12px}
.seq-n.blank{border:3px dashed var(--frog);background:transparent;min-width:70px;text-align:center}
.seq-arrow{color:var(--ink-2);font-size:20px}
.pv{display:flex;gap:10px}
.pv-col{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.pv-h{font-weight:700}
.pv-s{font-family:var(--f-num);color:var(--ink-2)}
.pv .np-slot{min-width:0;width:64px}
.digits{display:grid;grid-template-columns:repeat(5,minmax(48px,64px));gap:8px}
.dg{height:56px;border-radius:12px;border:3px solid var(--rule);background:var(--surface-2);font-family:var(--f-num);font-size:26px;font-weight:600}
.dg.on{border-color:var(--frog);background:color-mix(in srgb,var(--frog) 22%,var(--surface))}
.dg.right{border-color:var(--good);background:var(--good-bg)}
.dg.wrong{border-color:var(--bad);background:var(--bad-bg)}
.vc{display:inline-flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:16px;padding:12px 18px;font-family:var(--f-num);font-size:34px;font-weight:600}
.vc-row{display:grid;grid-template-columns:36px repeat(3,56px);align-items:center;justify-items:center}
.vc-head{font-size:14px;color:var(--ink-2);font-family:var(--f-body);font-weight:500}
.vc-line{height:3px;background:var(--ink);margin-left:36px}
.vc-ans .vc-d{min-height:58px;display:grid;place-items:center}
.vc-op{font-size:28px}

  'SC-2-1-1':{name:'角、頂點和邊'},

/* ================= storage ================= */
const LS_KEY='mm_sessions_v1', LS_STU='mm_student';
const ls = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let db=null, cloud=false, sessions=ls.get(LS_KEY,[]);
// 執行環境：Google Apps Script（學生掃碼版）或 Claude 頁面
const IS_GAS = !!(window.google && google.script && google.script.run);

if(IS_GAS){ cloud = true; sessions = []; }
const STUDENTS=['方宥桐','李語甯','林芝樂','武南疼','陳乙菲','陳奕辰','楊振宇','劉力倫','鄭呈胤','羅侑宗'];

const avatar=(n,i)=>`<span class="av" style="background:${AV_COLORS[i%3]}">${esc(n.slice(-1))}</span>`;

// 每位學生要練的指標（依全卷錯誤的學習單）；沒列出的學生先顯示全部關卡
const ASSIGN={
  '羅侑宗':['NC-2-13-1','SC-2-1-1','NC-2-12-1','NC-2-8-3','NC-2-12-2','NC-2-1-2','NC-2-5-1'],

  '劉力倫':['NC-2-5-1','SC-2-4-2','NC-2-12-1','NC-2-2-2','NC-2-8-3','NC-2-4-1','NC-2-1-2','SC-2-1-3'],
  '楊振宇':['NC-2-1-2','NC-2-5-1','SC-2-4-2','NC-2-12-1','NC-2-8-1','NC-2-8-3'],
  '陳奕辰':['NC-2-12-1','NC-2-2-2','NC-2-8-1','NC-2-8-3','NC-2-1-2','NC-2-13-1','SC-2-4-2'],
  '陳乙菲':['SC-2-1-3','NC-2-5-1','NC-2-13-1','NC-2-8-3','NC-2-4-1','RC-2-2-1','NC-2-1-2'],
  '武南疼':['NC-2-1-2','NC-2-11-1','NC-2-5-1','NC-2-13-1','NC-2-12-1','NC-2-3-1','NC-2-8-3','NC-2-4-1','NC-2-7-1'],

  '李語甯':['NC-2-1-2','SC-2-3-1','NC-2-6-2','NC-2-2-2','NC-2-8-3','NC-2-4-1','NC-2-12-2','NC-2-7-1'],

const assigned=(who,id)=>!ASSIGN[who]||ASSIGN[who].includes(id);
const levelCount=who=>ASSIGN[who]?ASSIGN[who].length:Object.keys(LEVELS).length;
let writeChain = Promise.resolve();

function persist(sess){
  sess.rev = (sess.rev||0)+1;
  const copy = JSON.parse(JSON.stringify(sess));
  const i = sessions.findIndex(s=>s.id===copy.id);
  if(i>=0) sessions[i]=copy; else sessions.push(copy);
  if(IS_GAS){
    google.script.run
      .withSuccessHandler(()=>{ if(saveFailed){saveFailed=false;toast('');} })
      .withFailureHandler(e=>{ console.warn(e); saveFailed=true; toast('這一題沒有存到，請檢查網路，再繼續作答就會補存。'); })
      .saveSession(JSON.stringify(copy));
    return;
  }
  if(!cloud){ ls.set(LS_KEY,sessions); return; }
  writeChain = writeChain.then(()=>db.collection('sessions').doc(copy.id).set(copy))
    .catch(e=>{ console.warn('save failed',e); ls.set(LS_KEY,sessions); });
}

(async()=>{
  try{
    if(IS_GAS || !window.claude?.use) return;
    db = await window.claude.use('db');
    if(!db) return;
    cloud = true;
    db.collection('sessions').onSnapshot(snap=>{
      const remote = snap.docs.map(d=>d.data()).filter(Boolean);
      // keep any local sessions not yet in the cloud (e.g. in-flight)
      const ids = new Set(remote.map(s=>s.id));
      sessions = remote.concat(sessions.filter(s=>!ids.has(s.id)));
      if(view.name!=='play') render();
    }, err=>{ console.warn(err); });
    if(view.name!=='play') render();
  }catch(e){ console.warn(e); }
})();

/* ================= helpers ================= */
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=msg; t.hidden=!msg;
}
function mergeSessions(list){
  const ids=new Set(list.map(s=>s.id));
  sessions=list.concat(sessions.filter(s=>!ids.has(s.id)));
}
function loadStudent(name){
  if(!IS_GAS) return;
  google.script.run.withSuccessHandler(txt=>{
    mergeSessions(JSON.parse(txt||'[]'));
    if(view.name==='map'&&student===name) render();
  }).withFailureHandler(e=>console.warn(e)).getStudentSessions(name);

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const r10 = n=>Math.round(n/10)*10, r100 = n=>Math.round(n/100)*100;
const today = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtTime = iso=>{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const OPS = {'+':(a,b)=>a+b,'-':(a,b)=>a-b};
const opChar = o=>o==='+'?'＋':'－';

/* ================= NC-2-4-1 item generators ================= */
// two-digit number whose ones digit is not 0 or 5 (no "exactly halfway" cases)
const okOnes = [1,2,3,4,6,7,8,9];
function twoDigit(){return ri(1,9)*10+pick(okOnes)}
// three-digit number near a hundred (within 35), like 292, 308, 503, 712
function nearHundred(){let h=ri(1,9)*100, d=pick([-1,1])*ri(2,35); const n=h+d; return (n>100&&n<1000&&n%10!==5&&n%100!==50)?n:nearHundred()}

function genPair(kind, op){
  for(let t=0;t<500;t++){
    let a,b;
    if(kind===2){a=twoDigit();b=twoDigit();}
    else {a=nearHundred();b=nearHundred();}
    if(op==='-'&&a<b)[a,b]=[b,a];
    const exact=OPS[op](a,b);
    const R = kind===2?r10:r100, u = kind===2?10:100;
    const est = OPS[op](R(a),R(b));
    if(op==='-'&&exact<(kind===2?10:100)) continue;
    if(kind===2&&op==='+'&&exact>99) continue;
    if(kind===3&&(exact>999)) continue;
    if(R(exact)!==est) continue;           // rounding first and rounding the answer must agree
    if(est<=0) continue;
    return {a,b,op,exact,est,unit:u,ra:R(a),rb:R(b)};
  }
}
function optionsAround(est,u){ // three consecutive tens/hundreds, correct one in a random slot
  let start = est - u*ri(0,2); while(start<=0) start+=u;
  return [start,start+u,start+2*u];
}

const STAGES = [
  {key:'line', title:'數線上的青蛙', tip:'把青蛙放到數線上，再說說牠比較靠近哪一邊。', render:it=>renderLine(it), items:()=>{
    const lows=shuffle([1,2,3,4]), highs=shuffle([6,7,8,9]);
    const t=shuffle([2,3,4,5,6,7,8]);
    const list=[
      {n:t[0]*10+lows[0]},{n:t[1]*10+highs[0]},{n:t[2]*10+highs[1]},
      (()=>{const h=ri(1,8)*100;return {n:h+ri(2,40)}})(),
      (()=>{const h=ri(1,8)*100;return {n:h+ri(60,98)}})(),
    ];
    return shuffle(list).map(x=>{const u=x.n>=100?100:10;const lo=Math.floor(x.n/u)*u;return {n:x.n,lo,hi:lo+u,unit:u,ans:(x.n-lo<lo+u-x.n)?lo:lo+u}});
  }},

  ])},
  {key:'flash', title:'閃電估算', tip:'不用算出真正的答案，看一看就選「最接近」的數。', render:it=>renderFlash(it), items:()=>shuffle([
    genPair(2,'+'),genPair(2,'-'),genPair(2,'+'),genPair(3,'+'),genPair(3,'-'),genPair(3,pick(['+','-']))
  ]).map(p=>({...p,opts:optionsAround(p.est,p.unit)}))},
  {key:'detect', title:'抓錯小偵探', tip:'同學算出的答案合理嗎？先估一估再決定。', render:it=>renderDetect(it), items:genDetect},
];

function colConcat(a,b){ // 387+293 -> "5|17|10" written together = 51710 (no regrouping)
  const A=String(a).padStart(3,'0'),B=String(b).padStart(3,'0');let s='';
  for(let i=0;i<3;i++)s+=(+A[i]+ +B[i]);return +s;
}
function bigMinusSmall(a,b){ // 702-389 -> 7-3, |0-8|, |2-9| = 487
  const A=String(a).padStart(3,'0'),B=String(b).padStart(3,'0');let s='';
  for(let i=0;i<3;i++)s+=Math.abs(+A[i]-+B[i]);return +s;
}
function noCarry(a,b){
  const A=String(a).padStart(3,'0'),B=String(b).padStart(3,'0');let s='';
  for(let i=0;i<3;i++)s+=((+A[i]+ +B[i])%10);return +s;
}
function genDetect(){
  const names=shuffle(['小芳','小奇','小祥','大維','小美','阿哲']);
  const unreasonable=(p,w)=>w!==p.exact&&r100(w)!==p.est&&Math.abs(w-p.exact)>=150;
  const make=(type)=>{
    for(let t=0;t<400;t++){
      const op = type==='concat'||type==='nocarry'?'+':type==='bigminus'||type==='wrongop'?'-':pick(['+','-']);
      const p=genPair(3,op); if(!p) continue;
      let shown=p.exact, wrongType='';
      if(type==='concat'){shown=colConcat(p.a,p.b);wrongType='每一位加完直接寫在一起';}
      if(type==='nocarry'){shown=noCarry(p.a,p.b);wrongType='忘記進位';}
      if(type==='bigminus'){shown=bigMinusSmall(p.a,p.b);wrongType='每一位都用大減小';}
      if(type==='wrongop'){shown=p.a+p.b;wrongType='減法算成加法';}
      if(type!=='ok'&&!unreasonable(p,shown)) continue;
      return {...p,shown,reasonable:type==='ok',wrongType,opts:optionsAround(p.est,100)};
    }
  };
  const list=[make('ok'),make('ok'),make('concat'),make(pick(['bigminus','nocarry'])),make('wrongop')].filter(Boolean);
  return shuffle(list).map((x,i)=>({...x,who:names[i]}));
}

function newSession(levelId){

}
const stagePass = st=>st.total>0&&st.correct>=st.total-1;

function levelStatus(id,who=student){
  const mine=sessions.filter(s=>s.level===id&&s.student===who);
  if(!LEVELS[id].game) return {label:'製作中',cls:'',done:false};
  if(!mine.length) return {label:'開始闖關',cls:'go',done:false,open:true};
  const passDays=new Set(mine.filter(s=>s.passed).map(s=>s.day));
  if(passDays.size>=2) return {label:'穩定會了',cls:'good',done:true,open:true};
  if(passDays.size===1) return {label:'過關一次・改天再測',cls:'warn',done:false,open:true};
  return {label:'練習中',cls:'bad',done:false,open:true};
}

/* ================= game: NC-2-4-1 ================= */
function startLevel(id){
  const G=GAMES[id]; if(!G) return;
  S={level:id, G, sess:newSession(id), si:0, ii:0, items:null, all:G.stages.map(st=>st.items()), t0:0};
  view={name:'play'};
  showStageIntro();
}
function playShell(inner){
  const N=S.G.stages.length, done=S.si>=N, st=done?{title:'闖關完成'}:S.G.stages[S.si];
  const track=S.sess.stages.map((s,k)=>{
    const n = S.all[k].length;
    let dots='';
    for(let i=0;i<n;i++){
      const it=s.items[i];
      const cls = it?(it.ok?'ok':'no'):(k===S.si&&i===S.ii&&S.items?'now':'');
      dots+=`<b class="${cls}"></b>`;
    }
    return `<span class="leg" title="${s.title}">${dots}</span>`;
  }).join('');
  $('#app').innerHTML=`
  <section class="play">
    <div class="play-top">
      <div class="stage-title"><span class="eyebrow">${S.level}・${done?'全部走完':`第 ${S.si+1} 站／共 ${N} 站`}</span><h2>${st.title}</h2></div>
      <button class="btn ghost small" id="quit">回地圖</button>
    </div>
    <div class="track" aria-label="進度">${track}</div>
    ${inner}
  </section>`;
  $('#quit').addEventListener('click',()=>{S=null;view={name:'map'};render();});
}
function showStageIntro(){
  const st=S.G.stages[S.si];
  if(S.si===0){
    playShell(`<div class="center">
      <p class="say">${S.G.intro}</p>
      <div class="intro-list">
        ${S.G.stages.map((s,i)=>`<div><b>${i+1}</b><span><strong>${s.title}</strong><br><span class="muted">${s.tip}</span></span></div>`).join('')}
      </div>
      <button class="btn" id="go">出發！</button></div>`);
  } else {
    playShell(`<div class="center"><p class="eyebrow">下一站</p><h2>${st.title}</h2><p class="say">${st.tip}</p><button class="btn" id="go">開始</button></div>`);
  }
  $('#go').addEventListener('click',()=>{S.items=S.all[S.si];S.ii=0;nextItem();});
}
function nextItem(){
  if(S.ii>=S.items.length){
    S.si++;
    if(S.si>=S.G.stages.length){finishSession();return;}
    S.items=null;showStageIntro();return;
  }
  S.t0=performance.now();
  S.G.stages[S.si].render(S.items[S.ii]);
}
function record(rec){
  const st=S.sess.stages[S.si];
  rec.ms=Math.round(performance.now()-S.t0);
  st.items.push(rec); st.total=st.items.length; st.correct=st.items.filter(x=>x.ok).length;
  persist(S.sess);
}
function showFeedback(ok,msg){
  const box=document.createElement('div');
  box.className='feedback '+(ok?'ok':'no');
  box.innerHTML=`<p><strong>${ok?'答對了！':'再看一次'}</strong>${msg}</p><button class="btn" id="next">下一題</button>`;
  $('.play').appendChild(box);
  const b=$('#next',box); b.focus({preventScroll:true});
  box.scrollIntoView({block:'nearest',behavior:'smooth'});
  b.addEventListener('click',()=>{S.ii++;nextItem();});
}

/* ---- stage 1: number line ---- */
function renderLine(it){

  for(let v=it.lo;v<=it.hi;v+=step){const x=L+(v-it.lo)/(it.hi-it.lo)*(R-L);ticks.push(`<line x1="${x}" x2="${x}" y1="${Y-(v===it.lo||v===it.hi?16:10)}" y2="${Y+(v===it.lo||v===it.hi?16:10)}" stroke="var(--ink)" stroke-width="${v===it.lo||v===it.hi?4:2}"/>`);}
  playShell(`
    <p class="prompt">把青蛙拖到 <span class="num" style="font-size:30px;font-weight:600">${it.n}</span> 的位置，再按「放好了」。</p>
    <div class="nl-wrap"><svg id="nl" viewBox="0 0 ${W} 200" role="img" aria-label="${it.lo} 到 ${it.hi} 的數線">
      <line x1="${L}" x2="${R}" y1="${Y}" y2="${Y}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      ${ticks.join('')}
      <text x="${L}" y="${Y+52}" text-anchor="middle" font-size="30">${it.lo}</text>
      <text x="${R}" y="${Y+52}" text-anchor="middle" font-size="30">${it.hi}</text>
      <g id="frog" class="frog" transform="translate(${W/2} ${Y})">
        <g id="frogBody">
        <line x1="0" y1="0" x2="0" y2="-22" stroke="var(--frog-ink)" stroke-width="3"/>
        <ellipse cx="0" cy="-44" rx="26" ry="20" fill="var(--frog)" stroke="var(--frog-ink)" stroke-width="2.5"/>
        <circle cx="-11" cy="-62" r="9" fill="var(--frog)" stroke="var(--frog-ink)" stroke-width="2.5"/>
        <circle cx="11" cy="-62" r="9" fill="var(--frog)" stroke="var(--frog-ink)" stroke-width="2.5"/>
        <circle cx="-11" cy="-62" r="3.5" fill="var(--frog-ink)"/><circle cx="11" cy="-62" r="3.5" fill="var(--frog-ink)"/>
        <path d="M-10 -40 Q0 -32 10 -40" fill="none" stroke="var(--frog-ink)" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="-34" y="-84" width="68" height="90" fill="transparent"/>
        </g>
      </g>
    </svg></div>
    <div id="lineStep"><button class="btn" id="placed">放好了</button> <span class="muted" style="margin-left:8px">青蛙可以左右拖動</span></div>`);
  const svg=$('#nl'), frog=$('#frog');
  let x=W/2, dragging=false, moved=false;
  const toVal=px=>{let v=it.lo+(px-L)/(R-L)*(it.hi-it.lo);return twoD?Math.round(v):Math.round(v)};
  const toX=v=>L+(v-it.lo)/(it.hi-it.lo)*(R-L);
  const setX=px=>{px=Math.max(L,Math.min(R,px)); if(twoD) px=toX(toVal(px)); x=px; frog.setAttribute('transform',`translate(${x} ${Y})`);};
  const svgX=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse()).x};
  svg.addEventListener('pointerdown',e=>{dragging=true;moved=true;svg.setPointerCapture(e.pointerId);setX(svgX(e));});
  svg.addEventListener('pointermove',e=>{if(dragging)setX(svgX(e));});
  svg.addEventListener('pointerup',()=>dragging=false);
  svg.addEventListener('pointercancel',()=>dragging=false);
  $('#placed').addEventListener('click',()=>{
    const placed=toVal(x);
    const tol=twoD?1:10;
    const placeOk=moved&&Math.abs(placed-it.n)<=tol;
    svg.style.pointerEvents='none';
    const tPlace=Math.round(performance.now()-S.t0);
    $('#lineStep').innerHTML=`<p class="prompt" style="margin-bottom:10px">${it.n} 比較靠近哪一個數？</p>
      <div class="choices"><button class="choice" data-v="${it.lo}">${it.lo}</button><button class="choice" data-v="${it.hi}">${it.hi}</button></div>`;
    document.querySelectorAll('#lineStep .choice').forEach(btn=>btn.addEventListener('click',()=>{
      const v=+btn.dataset.v, nearOk=v===it.ans;
      document.querySelectorAll('#lineStep .choice').forEach(b=>{b.disabled=true;if(+b.dataset.v===it.ans)b.classList.add('right');else if(b===btn)b.classList.add('wrong');});
      const tags=[];
      if(!placeOk) tags.push('數線位置不對');
      if(!nearOk) tags.push(v===it.lo?'直接捨去（都選比較小的）':'遠近判斷錯');
      record({q:`${it.n} 靠近 ${it.lo} 還是 ${it.hi}`,answer:it.ans,given:v,placed,placeOk,nearOk,ok:placeOk&&nearOk,tPlace,tags});
      // show the frog at the correct spot and hop
      setX(toX(it.n)); const body=$('#frogBody'); body.classList.remove('hop'); void body.getBBox(); body.classList.add('hop');
      const dLo=it.n-it.lo, dHi=it.hi-it.n;
      const msg=`${it.lo} 到 ${it.n} 差 ${dLo}，${it.n} 到 ${it.hi} 差 ${dHi}，所以 ${it.n} 比較靠近 ${it.ans}。`+(placeOk?'':` 青蛙應該放在${dLo<dHi?'靠近 '+it.lo:'靠近 '+it.hi}的地方喔。`);
      showFeedback(placeOk&&nearOk,msg);
    }));
  });
}

/* ---- stage 2: split then estimate ---- */
function renderSplit(it){
  const u=it.unit, word=u===10?'整十':'整百';
  const lowA=Math.floor(it.a/u)*u, lowB=Math.floor(it.b/u)*u;
  const est=it.est, opts=optionsAround(est,u);
  playShell(`
    <p class="prompt">估算 <span class="num" style="font-size:30px;font-weight:600">${it.a} ${opChar(it.op)} ${it.b}</span>：先把每個數變成最接近的${word}。</p>
    <div class="steps">
      <div class="step" id="s1"><span class="lhs">${it.a} ≈</span><div class="choices">${[lowA,lowA+u].map(v=>`<button class="choice" data-v="${v}">${v}</button>`).join('')}</div></div>
      <div class="step dim" id="s2"><span class="lhs">${it.b} ≈</span><div class="choices">${[lowB,lowB+u].map(v=>`<button class="choice" data-v="${v}" disabled>${v}</button>`).join('')}</div></div>
      <div class="step dim" id="s3"><span class="lhs" id="s3l">？ ${opChar(it.op)} ？ ＝</span><div class="choices">${opts.map(v=>`<button class="choice" data-v="${v}" disabled>${v}</button>`).join('')}</div></div>
    </div>`);
  const res={};
  const wire=(id,correct,key,after)=>{
    const box=$('#'+id);
    box.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
      const v=+b.dataset.v; res[key]=v;
      box.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.v===correct)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      after();
    }));
  };
  const enable=id=>{const b=$('#'+id);b.classList.remove('dim');b.querySelectorAll('.choice').forEach(x=>x.disabled=false);};
  wire('s1',it.ra,'ra',()=>{enable('s2');});
  wire('s2',it.rb,'rb',()=>{$('#s3l').textContent=`${it.ra} ${opChar(it.op)} ${it.rb} ＝`;enable('s3');});
  wire('s3',est,'est',()=>{
    const okA=res.ra===it.ra, okB=res.rb===it.rb, okE=res.est===est;
    const tags=[]; if(!okA||!okB) tags.push('取整十／整百錯'); if(!okE) tags.push('估完後計算錯');
    record({q:`${it.a}${it.op}${it.b}`,answer:est,given:res.est,steps:{ra:res.ra,rb:res.rb},ok:okA&&okB&&okE,tags});
    showFeedback(okA&&okB&&okE,`${it.a} ≈ ${it.ra}，${it.b} ≈ ${it.rb}，${it.ra} ${opChar(it.op)} ${it.rb} ＝ ${est}，所以答案大約是 ${est}。`);
  });
}

/* ---- stage 3: flash estimate ---- */
const FLASH_MS=8000;
function renderFlash(it){
  playShell(`
    <p class="prompt">答案最接近哪一個數？</p>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>

    <div class="choices" id="fc">${it.opts.map(v=>`<button class="choice" data-v="${v}">${v}</button>`).join('')}</div>`);
  const bar=$('#bar');
  requestAnimationFrame(()=>{bar.style.transitionDuration=FLASH_MS+'ms';bar.style.transform='scaleX(0)';});
  document.querySelectorAll('#fc .choice').forEach(b=>b.addEventListener('click',()=>{
    const v=+b.dataset.v, ok=v===it.est;
    bar.style.transitionDuration='0ms';
    document.querySelectorAll('#fc .choice').forEach(x=>{x.disabled=true;if(+x.dataset.v===it.est)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
    const ms=performance.now()-S.t0, tags=[];
    if(!ok) tags.push('估算選錯');
    if(ms>FLASH_MS) tags.push('超過 8 秒（可能在精算）');

    showFeedback(ok,`${it.a} ≈ ${it.ra}，${it.b} ≈ ${it.rb}，${it.ra} ${opChar(it.op)} ${it.rb} ＝ ${it.est}。`);
  }));
}

/* ---- stage 4: is it reasonable? ---- */
function renderDetect(it){
  playShell(`
    <div class="detective"><span class="face">${it.who.slice(-1)}</span>
      <div><p class="muted">${it.who}算出：</p><p class="eq">${it.a} ${opChar(it.op)} ${it.b} ＝ ${it.shown}</p></div></div>

      <div class="step dim" id="d2"><span class="say" style="min-width:150px">正確答案大約是多少？</span>
        <div class="choices">${it.opts.map(v=>`<button class="choice" data-v="${v}" disabled>${v}</button>`).join('')}</div></div>
    </div>`);
  let judged=null;
  $('#d1').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{

function wirePad(root, opt, onSubmit){
  const slots=[...root.querySelectorAll('.np-slot')].sort((a,b)=>a.dataset.i-b.dataset.i);
  const dir=opt.dir||1, max=opt.max||slots.map(()=>4), vals=slots.map(()=>'');
  const okBtn=root.querySelector('.np-k.go');
  let act=opt.start??0, done=false;
  const ready=()=>opt.ready?opt.ready(vals):vals.every(v=>v!=='');
  const paint=()=>{slots.forEach((el,i)=>{el.textContent=vals[i];el.classList.toggle('act',i===act&&!done);});okBtn.disabled=done||!ready();};
  const inRange=i=>i>=0&&i<slots.length;
  const press=k=>{
    if(done) return;
    if(k==='⌫'){ if(!vals[act]&&inRange(act-dir)) act-=dir; vals[act]=vals[act].slice(0,-1); }
    else if(k==='確定'){ if(!ready()) return; done=true; paint(); root.querySelectorAll('.np-k,.np-slot').forEach(b=>b.disabled=true); document.removeEventListener('keydown',kb); onSubmit(vals.slice()); return; }
    else {
      if(vals[act].length>=max[act]){ if(inRange(act+dir)) act+=dir; else return; }
      vals[act]+=k;
      if(vals[act].length>=max[act]&&inRange(act+dir)) act+=dir;
    }
    paint();
  };
  slots.forEach((el,i)=>el.addEventListener('click',()=>{if(!done){act=i;paint();}}));
  root.querySelectorAll('.np-k').forEach(b=>b.addEventListener('click',()=>press(b.dataset.k)));
  const kb=e=>{ if(!root.isConnected){document.removeEventListener('keydown',kb);return;}
    if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace'){e.preventDefault();press('⌫');} else if(e.key==='Enter'&&ready()){e.preventDefault();press('確定');} };
  document.addEventListener('keydown',kb);
  paint();
}

function vertHTML(a,b,op,{answer=null,slots=true}={}){

    <div class="vc-row"><span class="vc-op">${op==='+'?'＋':'－'}</span>${B.map((d,i)=>cell(d,i,b)).join('')}</div>
    <div class="vc-line"></div>
    <div class="vc-row vc-ans"><span class="vc-op"></span>${ans}</div>

function explainVert(a,b,op){
  const A=digits3(a),B=digits3(b),name=['百','十','個'];let carry=0,out=[];
  const r=[0,0,0];
  for(let i=2;i>=0;i--){
    if(op==='+'){const s=A[i]+B[i]+carry; r[i]=s%10; out.push(`${name[i]}位 ${A[i]}＋${B[i]}${carry?'＋1':''}＝${s}${s>=10?`，寫 ${s%10} 進 1`:''}`); carry=s>=10?1:0;}
    else {let x=A[i]-carry; let s=x-B[i]; if(s<0){out.push(`${name[i]}位 ${x} 不夠減 ${B[i]}，向前一位借 1 變成 ${x+10}，${x+10}－${B[i]}＝${s+10}`); s+=10; carry=1;} else {out.push(`${name[i]}位 ${x}－${B[i]}＝${s}${carry&&A[i]!==x?`（被借走 1 了）`:''}`); carry=0;} r[i]=s;}
  }
  return out.join('；')+`。答案是 ${op==='+'?a+b:a-b}。`;
}
function subNoDecrement(a,b){ // borrowed but forgot to reduce the next column
  const A=digits3(a),B=digits3(b);let s='';
  for(let i=0;i<3;i++){ s+= A[i]<B[i]? (A[i]+10-B[i]) : (A[i]-B[i]); }
  return +s;
}
function vertError(a,b,op,given){
  if(op==='+'){ if(given===noCarry(a,b)) return '忘記進位'; if(given===colConcat(a,b)) return '進位的數直接寫在一起'; }
  else { if(given===bigMinusSmall(a,b)) return '沒有退位（每一位都大減小）'; if(given===subNoDecrement(a,b)) return '退位後忘記減 1'; }
  return null;
}
function genVert(type){
  for(let t=0;t<2000;t++){
    const a=ri(101,989), b=ri(op(type)==='+'?101:11, op(type)==='+'?899:a-1);
    const A=digits3(a),B=digits3(b);
    if(op(type)==='+'){
      const s=a+b; if(s>=1000) continue;
      const c1=A[2]+B[2]>=10, c2=A[1]+B[1]+(c1?1:0)>=10;
      if(type==='add0'&&!c1&&!c2) return {a,b,op:'+'};
      if(type==='add1'&&c1&&!c2) return {a,b,op:'+'};
      if(type==='add1t'&&!c1&&c2) return {a,b,op:'+'};
      if(type==='add2'&&c1&&c2) return {a,b,op:'+'};
    } else {
      if(b<100&&type!=='sub1s') continue;
      const b1=A[2]<B[2], b2=A[1]-(b1?1:0)<B[1];
      if(a-b<10) continue;
      if(type==='sub0'&&!b1&&!b2) return {a,b,op:'-'};
      if((type==='sub1'||type==='sub1s')&&b1&&!b2) return {a,b,op:'-'};
      if(type==='sub1t'&&!b1&&b2) return {a,b,op:'-'};
    }
  }
  function op(t){return t.startsWith('add')?'+':'-';}
}

/* bar model (線段圖) */
function barHTML(W,a,b,unknown){ // unknown: 'W' | 'a' | 'b'
  const L=40,R=600,w=R-L, xa=L+w*a/W;
  const lab=k=>unknown===k?'(　?　)':{W,a,b}[k];
  return `<div class="bar-wrap"><svg viewBox="0 0 640 150" role="img" aria-label="線段圖">
    <path d="M${L} 46 V36 H${R} V46" fill="none" stroke="var(--ink-2)" stroke-width="2"/>
    <text x="${(L+R)/2}" y="26" text-anchor="middle" font-size="26">${lab('W')}</text>
    <rect x="${L}" y="56" width="${xa-L}" height="34" rx="4" fill="var(--bar-a)" stroke="var(--ink)" stroke-width="2"/>
    <rect x="${xa}" y="56" width="${R-xa}" height="34" rx="4" fill="var(--bar-b)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M${L} 100 V110 H${xa-4} V100 M${xa+4} 100 V110 H${R} V100" fill="none" stroke="var(--ink-2)" stroke-width="2"/>
    <text x="${(L+xa)/2}" y="138" text-anchor="middle" font-size="26">${lab('a')}</text>
    <text x="${(xa+R)/2}" y="138" text-anchor="middle" font-size="26">${lab('b')}</text>
  </svg></div>`;
}

/* ================= NC-2-1-1 1000 以內的數 ================= */
function genHTO(kind){
  for(;;){
    const h=ri(1,9),t=ri(0,9),o=ri(0,9);
    if(kind==='t0'&&!(t===0&&o>0)) continue;
    if(kind==='o0'&&!(o===0&&t>0)) continue;
    if(kind==='any'&&(t===0||o===0)) continue;
    return {h,t,o,n:h*100+t*10+o};
  }
}
function genSeq(step,cross){
  for(;;){
    const start=ri(100,960), seq=Array.from({length:5},(_,i)=>start+i*step);
    if(seq.some(x=>x<100||x>1000)) continue;
    let ci=-1; for(let i=1;i<5;i++) if(Math.floor(seq[i]/100)!==Math.floor(seq[i-1]/100)) ci=i;
    if(cross&&ci<0) continue;
    if(!cross&&ci>=0&&Math.abs(step)<100) continue;
    const blank=cross?ci:ri(1,4);
    return {seq,blank,step,cross};
  }
}

function clockSVG(h,m,{interactive=false}={}){
  const C=160, ticks=[];
  for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, big=i%5===0, r1=big?126:132, r2=140;
    ticks.push(`<line x1="${C+r1*Math.sin(a)}" y1="${C-r1*Math.cos(a)}" x2="${C+r2*Math.sin(a)}" y2="${C-r2*Math.cos(a)}" stroke="var(--ink)" stroke-width="${big?3:1.4}"/>`); }
  const nums=Array.from({length:12},(_,i)=>{const n=i+1,a=n*30*Math.PI/180;return `<text x="${C+106*Math.sin(a)}" y="${C-106*Math.cos(a)+9}" text-anchor="middle" font-size="26">${n}</text>`}).join('');
  const ha=((h%12)+m/60)*30, ma=m*6;
  return `<div class="clock-wrap"><svg class="clock" id="clk" viewBox="0 0 320 320" role="img" aria-label="時鐘">
    <circle cx="${C}" cy="${C}" r="148" fill="var(--surface)" stroke="var(--ink)" stroke-width="5"/>
    ${ticks.join('')}${nums}
    <g id="hh" transform="rotate(${interactive?0:ha} ${C} ${C})"><line x1="${C}" y1="${C+12}" x2="${C}" y2="${C-72}" stroke="var(--ink)" stroke-width="11" stroke-linecap="round"/></g>
    <g id="mh" transform="rotate(${interactive?0:ma} ${C} ${C})"><line x1="${C}" y1="${C+16}" x2="${C}" y2="${C-118}" stroke="var(--line-s)" stroke-width="6" stroke-linecap="round"/></g>
    <circle cx="${C}" cy="${C}" r="8" fill="var(--ink)"/>
  </svg></div>`;
}

function readClockTags(it,gh,gm){
  const tags=[];
  if(gh===it.h%12+1&&it.m>=30&&gm===it.m) tags.push('時針快到下一個數字，就讀成下一點');
  else if(gh!==it.h) tags.push('時針讀錯');

const EDGE_SHAPES=[

function edgeSVG(sh,{sel=new Set(),reveal=false}={}){
  const S=48, P=24, X=x=>P+x*S, Y=y=>P+y*S;
  const maxX=Math.max(...sh.pts.map(p=>p[0])), maxY=Math.max(...sh.pts.map(p=>p[1]));
  const lines=sh.edges.map(([a,b,bd],i)=>{const [x1,y1]=sh.pts[a],[x2,y2]=sh.pts[b];
    const cls=reveal?(bd?(sel.has(i)?'e-ok':'e-miss'):(sel.has(i)?'e-bad':'')):(sel.has(i)?'e-on':'');
    return `<g class="edge ${cls}" data-e="${i}"><line class="e-hit" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"/><line class="e-vis" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"/></g>`;}).join('');
  return `<svg class="edge-svg" viewBox="0 0 ${X(maxX)+P} ${Y(maxY)+P}" role="img" aria-label="${sh.name}">${lines}</svg>`;
}
function figSVG(f){ // labelled figure for perimeter
  const S=40,P=84;
  const X=x=>P+x*S, Y=y=>P+y*S, pts=f.pts, maxX=Math.max(...pts.map(p=>p[0])), maxY=Math.max(...pts.map(p=>p[1]));
  const poly=`<polygon points="${pts.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" fill="var(--fig)" stroke="var(--ink)" stroke-width="3"/>`;
  const cx=pts.reduce((a,p)=>a+p[0],0)/pts.length, cy=pts.reduce((a,p)=>a+p[1],0)/pts.length;
  const labs=(f.labels||[]).map(([i,t])=>{const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];let mx=(x1+x2)/2,my=(y1+y2)/2;const ex=x2-x1,ey=y2-y1,L=Math.hypot(ex,ey)||1;const nx=ey/L,ny=-ex/L, side=Math.abs(nx)>0.3, anc=side?(nx>0?'start':'end'):'middle';mx+=nx*(side?0.3:0.5);my+=ny*(side?0.3:0.5);
    return `<text x="${X(mx)}" y="${Y(my)+7}" text-anchor="${anc}" font-size="22">${t}</text>`;}).join('');
  return `<div class="fig-wrap"><svg viewBox="0 0 ${X(maxX)+P} ${Y(maxY)+P}" role="img" aria-label="${f.name}">${poly}${labs}</svg></div>`;
}
function gridRectSVG(w,h,lshape){
  const S=30,P=16, cols=lshape?w+0:w, X=x=>P+x*S, Y=y=>P+y*S;
  let dots=''; for(let x=0;x<=w+1;x++) for(let y=0;y<=h+1;y++) dots+=`<circle cx="${X(x)}" cy="${Y(y)}" r="2.5" fill="var(--ink-2)"/>`;
  const pts=lshape?[[0,0],[lshape,0],[lshape,lshape],[w,lshape],[w,h],[0,h]]:[[0,0],[w,0],[w,h],[0,h]];
  return `<div class="fig-wrap"><svg viewBox="0 0 ${X(w+1)+P} ${Y(h+1)+P}" role="img" aria-label="方格紙上的圖形">${dots}<polygon points="${pts.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" fill="var(--fig)" fill-opacity=".6" stroke="var(--ink)" stroke-width="3"/></svg></div>`;
}

function regionSVG(kind,dots,gap=false){

  let shape='';
  if(kind==='rect') shape=gap?`<path d="M120 40 H60 V180 H240 V40 H160" fill="none" stroke="var(--ink)" stroke-width="5"/>`:`<rect x="60" y="40" width="180" height="140" fill="var(--fig)" stroke="var(--ink)" stroke-width="5"/>`;

  if(kind==='tri') shape=gap?`<path d="M135 52 L50 190 H250 L150 30 L142 42" fill="none" stroke="var(--ink)" stroke-width="5"/>`.replace('L142 42',''):`<polygon points="150,30 250,190 50,190" fill="var(--fig)" stroke="var(--ink)" stroke-width="5"/>`;

function pointFor(kind,where){
  if(kind==='rect'){ if(where==='in') return {x:ri(90,210),y:ri(70,150)}; if(where==='out') return pick([{x:ri(15,40),y:ri(30,200)},{x:ri(260,290),y:ri(30,200)},{x:ri(70,230),y:ri(198,212)}]);

  if(kind==='circle'){ const a=Math.random()*2*Math.PI; const r=where==='in'?ri(10,55):where==='out'?ri(100,108):80; return {x:150+r*Math.cos(a),y:110+r*Math.sin(a)*(where==='out'?0.95:1)}; }

const CM=40;
function rulerG(x0,y,len=13){ // ruler group drawn with its 0 at x0
  let t=`<rect x="${x0-14}" y="${y}" width="${len*CM+28}" height="56" rx="6" fill="var(--ruler)" stroke="var(--ink)" stroke-width="2"/>`;
  for(let i=0;i<=len*10;i++){ const x=x0+i*CM/10, big=i%10===0, mid=i%5===0; t+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+(big?22:mid?15:9)}" stroke="var(--ink)" stroke-width="${big?2:1}"/>`; if(big) t+=`<text x="${x}" y="${y+44}" text-anchor="middle" font-size="17">${i/10}</text>`; }
  return t;
}
function measureSVG(a,b,{ruler=true,id=''}={}){ // segment from a cm to b cm, ruler 0 at x=30
  const X=c=>30+c*CM;

    <line x1="${X(a)}" y1="52" x2="${X(a)}" y2="62" stroke="var(--ink-2)" stroke-dasharray="3 3"/><line x1="${X(b)}" y1="52" x2="${X(b)}" y2="62" stroke="var(--ink-2)" stroke-dasharray="3 3"/>

}

function cmpSide(){ const t=pick(['n','n','add','sub']); if(t==='n'){const v=ri(2,99);return {s:String(v),v};} if(t==='add'){const a=ri(1,9),b=ri(1,9);return {s:`${a}＋${b}`,v:a+b};} const a=ri(5,15),b=ri(1,a-1);return {s:`${a}－${b}`,v:a-b}; }
function cmpItem(kind){
  for(;;){
    if(kind==='nums'){ const a=ri(10,99),b=ri(10,99); if(a===b) continue; if(Math.floor(a/10)!==Math.floor(b/10)&&Math.random()<.5) continue; return {L:{s:String(a),v:a},R:{s:String(b),v:b}}; }
    if(kind==='eq'){ const a=ri(2,9),b=ri(2,9); return Math.random()<.5?{L:{s:`${a}＋${b}`,v:a+b},R:{s:String(a+b),v:a+b}}:{L:{s:String(a+b),v:a+b},R:{s:`${b}＋${a}`,v:a+b}}; }
    if(kind==='expr'){ const L=cmpSide(),R=cmpSide(); if(L.v===R.v||(!L.s.match(/[＋－]/)&&!R.s.match(/[＋－]/))) continue; if(L.v>30||R.v>30){ if(Math.abs(L.v-R.v)>20) continue; } return {L,R}; }
  }
}

        finishItem({q:it.text,answer:it.k*it.n,given:g,tags},ok,`${it.k}×${it.n}＝${it.k*it.n}，答案是 ${it.k*it.n} ${it.u}。`);});
    }},
  ]
};
